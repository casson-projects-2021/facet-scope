<!DOCTYPE html>
<html data-tampered="false">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Godot Tamper Monkey Detector</title>
    <script>
setTimeout(() => 
{   if( document.documentElement.dataset[ "tampered" ] == "true" ) 
    {   fetch( "http://localhost:8765/event-tamper", 
        {   method: 'POST',
            body: JSON.stringify({ msg: "ping" })
        }).catch( err => 
        {   console.log( "Godot offline, tamper" );
            window.location.href = "https://azgaar.github.io/Fantasy-Map-Generator/";
        });
        // tamper monkey will close this window, the tab cannot close itself, it was opened
        // using the OS
        // setTimeout(() => { window.close(); }, 1000 );
    } 
    else window.location.href = "https://azgaar.github.io/Fantasy-Map-Generator/";
}, 500 );

fetch( "http://localhost:8765/event-page", 
{   method: 'POST',
    body: JSON.stringify({ msg: "ping" })
}).catch( err => console.log( "Godot offline" ));
    </script>
</head>

</body>
</html>
